<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3E50" />
      <stop offset="100%" stop-color="#1A252F" />
    </linearGradient>
    <linearGradient id="accent-grad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>
    <linearGradient id="pages-grad-m" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4EAD4" />
    </linearGradient>
    <filter id="shadow-m" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full-bleed background with no rounding so maskable clipping works perfectly -->
  <rect width="512" height="512" fill="url(#bg-grad-m)" />

  <!-- Padded central content within 80% safe zone (x: 50-460, y: 50-460) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <g filter="url(#shadow-m)">
      <path d="M 96 140 C 96 124 112 114 128 114 L 384 114 C 400 114 416 124 416 140 L 416 380 C 416 396 400 406 384 406 L 128 406 C 112 406 96 396 96 380 Z" fill="url(#accent-grad-m)" />

      <!-- Open Pages Left -->
      <path d="M 120 136 C 160 136 210 148 248 162 L 248 376 C 210 362 160 350 120 350 Z" fill="url(#pages-grad-m)" />

      <!-- Open Pages Right -->
      <path d="M 392 136 C 352 136 302 148 264 162 L 264 376 C 302 362 352 350 392 350 Z" fill="url(#pages-grad-m)" />

      <!-- Spine Center Shadow -->
      <path d="M 248 162 L 264 162 L 264 376 L 248 376 Z" fill="#D3C5B4" />

      <!-- Text line flourishes -->
      <rect x="144" y="180" width="80" height="8" rx="4" fill="#34495E" opacity="0.35" />
      <rect x="144" y="204" width="72" height="8" rx="4" fill="#34495E" opacity="0.25" />
      <rect x="144" y="228" width="80" height="8" rx="4" fill="#34495E" opacity="0.25" />
      <rect x="144" y="252" width="60" height="8" rx="4" fill="#34495E" opacity="0.25" />

      <rect x="288" y="180" width="80" height="8" rx="4" fill="#34495E" opacity="0.35" />
      <rect x="288" y="204" width="76" height="8" rx="4" fill="#34495E" opacity="0.25" />
      <rect x="288" y="228" width="64" height="8" rx="4" fill="#34495E" opacity="0.25" />
      <rect x="288" y="252" width="78" height="8" rx="4" fill="#34495E" opacity="0.25" />

      <!-- Ribbon Bookmark -->
      <path d="M 250 150 L 262 150 L 262 310 L 256 300 L 250 310 Z" fill="#E74C3C" />
    </g>

    <circle cx="120" cy="96" r="6" fill="#F1C40F" />
    <circle cx="400" cy="96" r="8" fill="#F1C40F" />
    <circle cx="256" cy="90" r="10" fill="#F1C40F" />
  </g>
</svg>
